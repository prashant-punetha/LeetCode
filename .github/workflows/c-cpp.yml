name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Compile all C/C++ solutions
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/leetcode_prelude.hpp" <<'EOF'
        #include <bits/stdc++.h>
        using namespace std;
        EOF
        find . -type f \( -name "*.c" -o -name "*.cpp" \) -print0 | while IFS= read -r -d '' file; do
          if [[ "$file" == *.c ]]; then
            gcc -std=c11 -fsyntax-only -include stdbool.h -include math.h "$file"
          else
            g++ -std=c++17 -fsyntax-only -include "$RUNNER_TEMP/leetcode_prelude.hpp" "$file"
          fi
        done
